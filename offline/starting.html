<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayRoom is getting ready…</title>
<!--
  Served by Tailscale itself while `npm run share` is starting up or rebuilding
  the app. Self-contained on purpose: the game server isn't up yet.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFF6E6;--ink:#2E2140;--ink-soft:#6C5E85;--sun:#FFC53D;--coral:#FF6B6B;--mint:#3DD6C0;--sky:#4CC9F0;--grape:#9B5DE5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);
    color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;text-align:center}
  body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;pointer-events:none;background-image:
    radial-gradient(circle at 12% 18%,var(--sun) 0 5px,transparent 6px),radial-gradient(circle at 82% 12%,var(--coral) 0 4px,transparent 5px),
    radial-gradient(circle at 68% 74%,var(--mint) 0 5px,transparent 6px),radial-gradient(circle at 24% 82%,var(--grape) 0 4px,transparent 5px),
    radial-gradient(circle at 92% 52%,var(--sky) 0 4px,transparent 5px);background-size:520px 520px}
  h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;margin:18px 0 10px}
  .card{max-width:460px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:26px;
    box-shadow:0 6px 0 var(--ink);padding:30px 24px 26px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:1.4rem;
    text-shadow:0 3px 0 var(--sun);margin-bottom:6px}
  .scene{width:230px;margin:6px auto 0}
  .sway{transform-origin:100px 190px;animation:sway 3.4s ease-in-out infinite}
  .glass{transform-origin:150px 160px;animation:snoop 2.4s ease-in-out infinite}
  p{color:var(--ink-soft);font-weight:700;line-height:1.55;font-size:1.02rem}
  .dots{display:flex;justify-content:center;gap:10px;margin-top:20px}
  .dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);animation:hop 1.1s ease-in-out infinite}
  .dots i:nth-child(1){background:var(--sun)}.dots i:nth-child(2){background:var(--coral);animation-delay:.15s}
  .dots i:nth-child(3){background:var(--mint);animation-delay:.3s}.dots i:nth-child(4){background:var(--grape);animation-delay:.45s}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes snoop{0%,100%{transform:rotate(-8deg) translate(0,0)}50%{transform:rotate(10deg) translate(-6px,-8px)}}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
        <g transform="rotate(-13 17 28)"><rect x="5" y="15" width="18" height="25" rx="6" fill="#3DD6C0" stroke="#2E2140" stroke-width="3"/></g>
        <g transform="rotate(9 30 20)"><rect x="24" y="9" width="18" height="25" rx="6" fill="#FF6B6B" stroke="#2E2140" stroke-width="3"/></g>
        <g transform="rotate(-2 24 24)"><rect x="14" y="11" width="20" height="27" rx="7" fill="#FFC53D" stroke="#2E2140" stroke-width="3"/>
          <circle cx="20.5" cy="21" r="2.4" fill="#2E2140"/><circle cx="27.5" cy="21" r="2.4" fill="#2E2140"/>
          <path d="M20 28.5q4 3.6 8 0" stroke="#2E2140" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>
      </svg>
      PlayRoom
    </div>

    <div class="scene">
      <!-- the Detective from the login page, checking the room before letting anyone in -->
      <svg viewBox="0 0 200 224" width="230" aria-hidden="true">
        <ellipse cx="100" cy="209" rx="58" ry="10" fill="#2E2140" opacity=".16"/>
        <g class="sway">
          <rect x="52" y="138" width="22" height="58" rx="11" fill="#2E2140"/>
          <rect x="126" y="138" width="22" height="58" rx="11" fill="#2E2140"/>
          <rect x="40" y="62" width="120" height="106" rx="34" fill="#4CC9F0" stroke="#2E2140" stroke-width="6"/>
          <ellipse cx="100" cy="30" rx="42" ry="26" fill="#FF6B6B" stroke="#2E2140" stroke-width="6"/>
          <rect x="34" y="44" width="132" height="15" rx="7.5" fill="#2E2140"/>
          <ellipse cx="52" cy="52" rx="16" ry="11" fill="#FF6B6B" stroke="#2E2140" stroke-width="6"/>
          <ellipse cx="148" cy="52" rx="16" ry="11" fill="#FF6B6B" stroke="#2E2140" stroke-width="6"/>
          <circle cx="100" cy="10" r="8" fill="#FFC53D" stroke="#2E2140" stroke-width="5"/>
          <circle cx="82" cy="108" r="9" fill="#fff" stroke="#2E2140" stroke-width="3"/>
          <circle cx="118" cy="108" r="9" fill="#fff" stroke="#2E2140" stroke-width="3"/>
          <circle cx="85" cy="110" r="5.6" fill="#2E2140"/><circle cx="121" cy="110" r="5.6" fill="#2E2140"/>
          <path d="M88 130 q12 11 24 0" stroke="#2E2140" stroke-width="6" fill="none" stroke-linecap="round"/>
          <ellipse cx="42" cy="164" rx="20" ry="15" fill="#4CC9F0" stroke="#2E2140" stroke-width="6"/>
          <ellipse cx="158" cy="164" rx="20" ry="15" fill="#4CC9F0" stroke="#2E2140" stroke-width="6"/>
          <g class="glass">
            <line x1="150" y1="162" x2="176" y2="188" stroke="#2E2140" stroke-width="9" stroke-linecap="round"/>
            <circle cx="140" cy="152" r="27" fill="#fff" fill-opacity=".85" stroke="#2E2140" stroke-width="6"/>
            <path d="M126 144 q14 -10 28 0" stroke="#4CC9F0" stroke-width="5" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>

    <h1>Getting PlayRoom ready…</h1>
    <p>The host is starting the game room. This usually takes under a minute — the game will open here by itself.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </main>

<script>
  // The moment the game server answers on this same address, reload into it.
  async function check() {
    try {
      const r = await fetch("/api/health", { cache: "no-store" });
      const j = r.ok ? await r.json().catch(() => null) : null;
      if (j && j.success) location.reload();
    } catch (e) { /* not ready yet */ }
  }
  setInterval(check, 3000);
</script>
</body>
</html>
