<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFF6E6" />
    <meta name="description" content="PlayRoom — Your Multi-Game Platform" />
    <title>PlayRoom</title>

    <!-- Icons, all cut from src/assests/imgs/PR_logo.png. The browser picks the
         size it wants; iOS uses apple-touch-icon when you add to the home
         screen, and manifest.json covers Android. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fredoka for display, Nunito for body — the "Playdate" pairing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pre-paint background so first frame matches the theme (no flash). */
      body { margin: 0; background: #FFF6E6; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run PlayRoom.</noscript>
    <div id="root"></div>
  </body>
</html>
